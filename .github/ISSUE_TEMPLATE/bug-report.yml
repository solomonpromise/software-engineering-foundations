name: Website bug
description: Something on the website is broken or hard to use.
title: "[Bug] "
labels: ["website", "bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address (URL) where it happened.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. Android phone, Chrome"
