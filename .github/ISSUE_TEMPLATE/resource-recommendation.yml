name: Resource recommendation
description: Recommend a book, article, course or documentation page.
title: "[Resource] "
labels: ["resources"]
body:
  - type: input
    id: resource-url
    attributes:
      label: Link
      placeholder: https://
    validations:
      required: true
  - type: input
    id: resource-title
    attributes:
      label: Title and author
  - type: input
    id: related-lesson
    attributes:
      label: Related lesson or topic
  - type: textarea
    id: why
    attributes:
      label: Why is it worth recommending?
      description: Who is it for, and what does it explain well?
    validations:
      required: true
